<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PONログ</title>
<style>
  :root {
    --bg: linear-gradient(160deg, #f5f7fb 0%, #e9edf6 100%); --card: rgba(255,255,255,.88); --ink: #15171c; --sub: #6a7080; --line: rgba(20,24,40,.09);
    --grid3: rgba(20,24,40,.16); --grid1: rgba(20,24,40,.06); --lane: rgba(20,24,40,.045);
    --feed: #2f7bff; --milk: #7c5cff; --pee: #f5a524; --poop: #9a6b43;
    --warn: #f59e0b; --alert: #ef4444; --ok: #22a06b; --accent: #2f7bff;
    --btn: #ffffff; --btnInk: #15171c; --sheet: #ffffff; --chip: rgba(20,24,40,.06);
    --shadow: 0 1px 1px rgba(20,24,40,.04), 0 10px 28px rgba(20,24,40,.07);
    --clk: clamp(52px, 13.5vh, 118px);
  }
  body.night {
    --bg: linear-gradient(160deg, #0d0706 0%, #120907 100%); --card: rgba(30,16,13,.92); --ink: #ffb9a5; --sub: #a96b5e; --line: rgba(255,150,120,.12);
    --grid3: rgba(255,150,120,.20); --grid1: rgba(255,150,120,.07); --lane: rgba(255,150,120,.05);
    --feed: #ff7a5c; --milk: #e0705a; --pee: #e0a456; --poop: #b27a5e;
    --warn: #ffa050; --alert: #ff5040; --ok: #c98a68; --accent: #ff7a5c;
    --btn: #231310; --btnInk: #ffb9a5; --sheet: #1e100d; --chip: rgba(255,150,120,.10);
    --shadow: none;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100vh; color: var(--ink); background: var(--bg); background-attachment: fixed; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans", sans-serif;
    padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    transition: color .6s; -webkit-user-select: none; user-select: none;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
  svg { display: block; }
  .wrap { display: grid; gap: 10px; grid-template-columns: 1fr; }
  .colL, .colR { display: flex; flex-direction: column; gap: 10px; min-height: 0; min-width: 0; }
  .card { background: var(--card); border-radius: 22px; padding: 12px 16px; box-shadow: var(--shadow); border: 1px solid var(--line); transition: background .6s; }
  .label { color: var(--sub); font-size: 13px; font-weight: 600; letter-spacing: .02em; }

  /* 上段：時計は「前の授乳」の枠に少し乗せる */
  .top { position: relative; z-index: 2; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 0 6px; margin-bottom: calc(var(--clk) * -0.4); pointer-events: none; }
  .top > * { pointer-events: auto; }
  .clock { font-size: var(--clk); font-weight: 600; letter-spacing: -0.035em; font-variant-numeric: tabular-nums; line-height: 1; }
  .top-r { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; padding-bottom: calc(var(--clk) * 0.46); }
  .tools { display: flex; gap: 6px; }
  .tool { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 13px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); font-size: 12.5px; font-weight: 600; color: var(--sub); box-shadow: var(--shadow); }
  .tool svg { width: 15px; height: 15px; }
  .tool.on { color: var(--ok); }
  .tool.lock { color: var(--warn); }
  .tool.off { color: var(--alert); }
  .date { text-align: right; line-height: 1.15; }
  .date .dd { font-size: clamp(22px, 3.9vh, 32px); font-weight: 700; color: var(--ink); letter-spacing: -0.01em; }
  .date .da { font-size: 14px; color: var(--sub); font-weight: 500; margin-top: 3px; }

  /* 前の授乳から／次回授乳 */
  .hero { position: relative; display: grid; grid-template-columns: 1.05fr 1fr; gap: 6px 18px; padding-top: calc(var(--clk) * 0.4 + 10px); padding-bottom: 12px; }
  .blk .label { margin-bottom: 2px; }
  .since { font-size: clamp(46px, 14.5vh, 128px); font-weight: 700; letter-spacing: -0.045em; font-variant-numeric: tabular-nums; line-height: .98; }
  .since { white-space: nowrap; }
  .since.long { font-size: clamp(38px, 11.5vh, 100px); }
  .since small { font-size: .3em; font-weight: 600; letter-spacing: 0; margin: 0 5px 0 3px; color: var(--sub); }
  .nextT { font-size: clamp(40px, 12vh, 108px); font-weight: 700; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; line-height: 1; }
  .nextSub { font-size: 16px; font-weight: 600; color: var(--sub); margin-top: 4px; }
  .hero.warn .nextT, .hero.warn .nextSub { color: var(--warn); }
  .hero.alert .nextT, .hero.alert .nextSub { color: var(--alert); }
  .meta { grid-column: 1 / -1; font-size: 14.5px; color: var(--sub); display: flex; gap: 14px; flex-wrap: wrap; }
  .meta b { color: var(--ink); font-weight: 600; }
  .pill { position: absolute; top: 10px; right: 12px; height: 30px; padding: 0 14px; border-radius: 15px; background: var(--chip); font-size: 12.5px; font-weight: 600; color: var(--sub); }
  .pill b { color: var(--ink); font-weight: 700; margin-left: 4px; font-variant-numeric: tabular-nums; }

  /* 今日の流れ */
  .tl { padding-bottom: 10px; display: flex; flex-direction: column; min-height: 0; }
  .tlhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .legend { display: flex; gap: 10px; font-size: 11.5px; color: var(--sub); }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: 0; }
  .plot { flex: 1 1 auto; min-height: 120px; display: grid; grid-template-columns: 42px 1fr; grid-template-rows: 30px 1fr 1fr; column-gap: 4px; row-gap: 6px; margin-top: 6px; position: relative; }
  .axis { position: relative; grid-column: 2; grid-row: 1; }
  .tk { position: absolute; bottom: 4px; transform: translateX(-50%); font-variant-numeric: tabular-nums; white-space: nowrap; line-height: 1; }
  .tk.major { font-size: 13.5px; font-weight: 700; color: var(--ink); }
  .tk.minor { font-size: 10px; font-weight: 500; color: var(--sub); opacity: .65; }
  .tk.edge-l { transform: none; }
  .tk.edge-r { transform: translateX(-100%); }
  .lname { font-size: 12px; font-weight: 600; color: var(--sub); align-self: center; }
  .lane { position: relative; border-radius: 10px; background-color: var(--lane); cursor: pointer;
    background-image: linear-gradient(to right, var(--grid3) 1px, transparent 1px), linear-gradient(to right, var(--grid1) 1px, transparent 1px);
    background-size: calc(100% / 8) 100%, calc(100% / 24) 100%; overflow: hidden; }
  .seg { position: absolute; top: 18%; bottom: 18%; border-radius: 6px; min-width: 9px; }
  .pt { position: absolute; top: 50%; width: 13px; height: 13px; margin: -6.5px 0 0 -6.5px; border-radius: 50%; box-shadow: 0 0 0 2px var(--card); }
  .nowwrap { grid-column: 2; grid-row: 1 / 4; position: relative; pointer-events: none; }
  .now { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--alert); border-radius: 1px; }
  .now::before { content: ''; position: absolute; top: -1px; left: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--alert); }

  .vsw { display: inline-flex; background: var(--chip); border-radius: 10px; padding: 2px; margin-left: 12px; }
  .vsw button { padding: 4px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; color: var(--sub); }
  .vsw button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.14); }
  .dials { display: none; flex: 1 1 0; min-height: 0; margin-top: 6px; grid-template-columns: 1fr 1fr; grid-template-rows: minmax(0, 1fr); gap: 10px; }
  .dials svg { width: 100%; height: 100%; cursor: pointer; overflow: visible; }
  .tl.vclock .plot { display: none; }
  .tl.vclock .dials { display: grid; }
  .stats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; padding: 10px 12px; }
  .stat { text-align: center; }
  .stat .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .stat .k { font-size: 11px; color: var(--sub); margin-top: 2px; font-weight: 500; }

  /* ボタン */
  .btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .b { min-height: clamp(54px, 10vh, 84px); border-radius: 18px; background: var(--btn); color: var(--btnInk); font-size: 16.5px; font-weight: 650; line-height: 1.25; padding: 8px 8px; border: 1px solid var(--line); box-shadow: var(--shadow); transition: transform .12s, opacity .2s; display: flex; align-items: center; justify-content: center; gap: 6px; text-align: center; }
  .b:active { transform: scale(.96); opacity: .8; }
  .b .sw { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .agoRow { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
  .agoRow .label { white-space: nowrap; font-size: 12.5px; margin-right: 2px; }
  .chip { flex: 1; min-height: 38px; border-radius: 12px; background: var(--chip); font-size: 14px; font-weight: 600; color: var(--sub); padding: 8px 10px; }
  .chip.on { background: var(--ink); color: var(--card); }
  .recentcard { display: flex; flex-direction: column; min-height: 0; }
  .list { list-style: none; margin: 4px 0 0; padding: 0; }
  .list li { display: flex; align-items: stretch; border-bottom: 1px solid var(--line); }
  .list li:last-child { border-bottom: 0; }
  .list .t { width: 64px; text-align: left; font-variant-numeric: tabular-nums; color: var(--sub); font-size: 15.5px; font-weight: 600; padding: 9px 0; }
  .list .n { flex: 1; text-align: left; font-size: 16px; font-weight: 600; padding: 9px 0; display: flex; justify-content: space-between; align-items: center; }
  .list .n span.sub { color: var(--sub); font-weight: 500; font-size: 14px; }
  .list .n svg { width: 14px; height: 14px; color: var(--sub); opacity: .6; }
  .err { color: var(--alert); font-size: 12.5px; min-height: 0; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 220%); opacity: 0; pointer-events: none; background: rgba(21,23,28,.92); color: #fff; padding: 12px 20px; border-radius: 16px; font-size: 16.5px; font-weight: 600; transition: transform .35s cubic-bezier(.2,.9,.3,1.2), opacity .25s; z-index: 30; max-width: 90vw; text-align: center; }
  body.night .toast { background: rgba(70,24,18,.96); color: #ffb9a5; }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }
  .toast.act { pointer-events: auto; display: flex; gap: 14px; align-items: center; padding: 10px 12px 10px 20px; }
  .toast .ta { background: var(--accent); color: #fff; border-radius: 12px; padding: 9px 16px; font-size: 15.5px; font-weight: 700; }

  /* シート */
  .sheet { position: fixed; inset: 0; background: rgba(8,10,18,.38); display: none; align-items: flex-end; justify-content: center; z-index: 20; }
  .sheet.show { display: flex; animation: fade .2s ease; }
  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  @keyframes rise { from { transform: translateY(40px); opacity: .4 } to { transform: none; opacity: 1 } }
  .panel.wide { max-width: 680px; }
  .panel { background: var(--sheet); width: 100%; max-width: 560px; border-radius: 26px 26px 0 0; padding: 14px 18px max(16px, env(safe-area-inset-bottom)); animation: rise .28s cubic-bezier(.2,.9,.3,1); max-height: 92vh; overflow-y: auto; }
  .ph { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .ph h3 { margin: 0; font-size: 18px; font-weight: 700; }
  .ph .x { font-size: 15px; font-weight: 600; color: var(--accent); padding: 6px 4px; }
  .acts { display: flex; gap: 8px; margin-top: 12px; }
  .acts .btn { flex: 1; min-height: 48px; border-radius: 14px; font-size: 16px; font-weight: 650; background: var(--chip); }
  .acts .btn.pri { background: var(--accent); color: #fff; }
  .acts .btn.dng { color: var(--alert); flex: .7; }
  .rowl { display: flex; justify-content: space-between; align-items: center; padding: 12px 2px; border-bottom: 1px solid var(--line); font-size: 16px; }
  .rowl .k { color: var(--sub); font-weight: 600; font-size: 14px; }
  .rowl button.v { font-weight: 700; color: var(--accent); font-size: 17px; font-variant-numeric: tabular-nums; }
  .segc { display: flex; background: var(--chip); border-radius: 12px; padding: 3px; gap: 2px; margin: 8px 0; }
  .segc button { flex: 1; min-height: 40px; padding: 6px 10px; border-radius: 10px; font-size: 14.5px; font-weight: 600; color: var(--sub); }
  .segc button.on { background: var(--sheet); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  .stepper { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 8px 0; }
  .stepper .val { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 120px; text-align: center; }
  .stepper .val small { font-size: 15px; color: var(--sub); font-weight: 600; margin-left: 4px; }
  .stepper button { width: 56px; height: 56px; border-radius: 28px; background: var(--chip); font-size: 28px; font-weight: 500; line-height: 1; }
  .quick { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 6px; }
  .quick button { flex: 1; min-width: 56px; min-height: 38px; padding: 6px 10px; border-radius: 10px; background: var(--chip); font-size: 14px; font-weight: 600; }
  .noteIn { width: 100%; font: inherit; font-size: 16px; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--chip); color: var(--ink); margin: 8px 0; -webkit-user-select: text; user-select: text; }
  .wheels { display: flex; gap: 6px; justify-content: center; align-items: center; position: relative; isolation: isolate; }
  .wheel { position: relative; height: 220px; width: 110px; overflow-y: auto; scroll-snap-type: y mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch;
    -webkit-mask-image: linear-gradient(transparent, #000 32%, #000 68%, transparent); mask-image: linear-gradient(transparent, #000 32%, #000 68%, transparent); }
  .wheel::-webkit-scrollbar { display: none; }
  .wheel .pad { height: 88px; }
  .wheel .it { height: 44px; scroll-snap-align: center; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink); }
  .wc { position: relative; display: flex; flex-direction: column; align-items: center; }
  .wl { font-size: 17px; font-weight: 700; color: var(--sub); height: 26px; }
  .wheel.big { height: 270px; width: 170px; }
  .wheel.big .pad { height: 109px; }
  .wheel.big .it { height: 52px; font-size: 30px; }
  .bandc { position: absolute; left: 6px; right: 6px; top: 135px; height: 52px; border-radius: 14px; background: var(--chip); z-index: -1; }
  .panel.wide .acts .btn { min-height: 58px; font-size: 18px; }
  .panel.wide .segc button { min-height: 46px; font-size: 16px; }
  .band { position: absolute; left: 6px; right: 6px; top: 88px; height: 44px; border-radius: 12px; background: var(--chip); pointer-events: none; z-index: -1; }
  .wheels .colon { font-size: 26px; font-weight: 700; padding-bottom: 2px; }
  .daystep { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 6px 0 2px; font-weight: 600; font-size: 15px; }
  .daystep button { width: 40px; height: 36px; border-radius: 10px; background: var(--chip); font-size: 18px; }
  .vlist { list-style: none; margin: 0; padding: 0; }
  .vlist li { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 10px 2px; border-bottom: 1px solid var(--line); }
  .vlist li:last-child { border-bottom: 0; }
  .vlist .p { font-size: 17px; font-weight: 650; }
  .vlist .d { font-size: 13px; color: var(--sub); text-align: right; }
  .note2 { font-size: 13px; color: var(--sub); line-height: 1.6; margin: 10px 2px 0; }
  .pick svg { width: 14px; height: 14px; color: var(--sub); flex: none; }
  .pick button { display: flex; align-items: center; width: 100%; justify-content: space-between; padding: 14px 4px; border-bottom: 1px solid var(--line); font-size: 17px; font-weight: 600; text-align: left; }

  /* 壁掛け（横向き）：スクロールなしで全部収める */
  @media (orientation: landscape) and (min-width: 800px) {
    html, body { height: 100vh; height: 100dvh; min-height: 0; overflow: hidden; }
    .wrap { height: 100%; grid-template-columns: 1.14fr 1fr; }
    .colL .hero { flex: none; }
    .colL .tl { flex: 1 1 0; }
    .colR .controls { flex: none; }
    .colR .recentcard { flex: 1 1 0; overflow: hidden; }
    .colR .recentcard .list { flex: 1 1 0; min-height: 0; overflow: hidden; }
    .sheet { align-items: center; }
    .panel { border-radius: 26px; max-width: 520px; }
  }
  @media (max-width: 700px) {
    .stats { grid-template-columns: repeat(3, 1fr); row-gap: 10px; }
    .btns { grid-template-columns: repeat(2, 1fr); }
    .hero { grid-template-columns: 1fr; }
    .plot { min-height: 150px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="colL">
    <div class="top">
      <div class="clock" id="clock" title="タップで夜モード切り替え">--:--</div>
      <div class="top-r">
        <div class="tools">
          <button class="tool" id="helpBtn" aria-label="声の例"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>声の例</button>
          <button class="tool off" id="voiceBtn" aria-label="音声案内"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg><span id="voiceTxt">音声案内 オフ</span></button>
        </div>
        <div class="date"><div class="dd" id="date"></div><div class="da" id="age"></div></div>
      </div>
    </div>

    <div class="card hero" id="hero">
      <button class="pill" id="ivBtn">授乳間隔<b id="ivVal">3:00</b></button>
      <div class="blk"><div class="label">前の授乳から</div><div class="since" id="since">--</div></div>
      <div class="blk"><div class="label">次回授乳</div><div class="nextT" id="nextT">--:--</div><div class="nextSub" id="nextSub"></div></div>
      <div class="meta" id="meta"></div>
    </div>

    <div class="card tl" id="tlcard">
      <div class="tlhead"><div style="display:flex;align-items:center"><div class="label">今日の流れ</div><div class="vsw" id="vsw"><button data-view="bar" class="on">帯</button><button data-view="clock">時計</button></div></div>
        <div class="legend"><span><i style="background:var(--feed)"></i>母乳</span><span><i style="background:var(--milk)"></i>ミルク・搾乳</span><span><i style="background:var(--pee)"></i>おしっこ</span><span><i style="background:var(--poop)"></i>うんち</span></div>
      </div>
      <div class="plot" id="plot">
        <div class="axis" id="axis"></div>
        <div class="lname" style="grid-row:2">授乳</div><div class="lane" id="laneFeed" style="grid-column:2;grid-row:2"></div>
        <div class="lname" style="grid-row:3">おむつ</div><div class="lane" id="laneDiaper" style="grid-column:2;grid-row:3"></div>
        <div class="nowwrap"><div class="now" id="nowline"></div></div>
      </div>
      <div class="dials" id="dials"></div>
    </div>

    <div class="card stats" id="stats"></div>
  </div>

  <div class="colR">
    <div class="card controls">
      <div class="btns">
        <button class="b" data-a="add" data-t="breast" data-side="L"><span class="sw" style="background:var(--feed)"></span>母乳 左</button>
        <button class="b" data-a="add" data-t="breast" data-side="R"><span class="sw" style="background:var(--feed)"></span>母乳 右</button>
        <button class="b" data-a="end" data-t="breast">おっぱい<br>終わり</button>
        <button class="b" data-open="milk"><span class="sw" style="background:var(--milk)"></span>ミルク</button>
        <button class="b" data-a="add" data-t="pee"><span class="sw" style="background:var(--pee)"></span>おしっこ</button>
        <button class="b" data-a="add" data-t="poop"><span class="sw" style="background:var(--poop)"></span>うんち</button>
        <button class="b" data-a="add" data-t="both"><span class="sw" style="background:linear-gradient(135deg,var(--pee) 50%,var(--poop) 50%)"></span>両方</button>
        <button class="b" data-a="undo">取り消し</button>
      </div>
      <div class="agoRow">
        <span class="label">時刻</span>
        <button class="chip on" data-ago="0">いま</button>
        <button class="chip" data-ago="10">10分前</button>
        <button class="chip" data-ago="30">30分前</button>
        <button class="chip" data-ago="60">1時間前</button>
      </div>
    </div>
    <div class="card recentcard">
      <div class="label">さいきんの記録　<span style="font-weight:500">タップで直せます</span></div>
      <ul class="list" id="recent"></ul>
      <div class="err" id="err"></div>
    </div>
  </div>
</div>

<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>

/* ───────── 上段・ヒーロー ───────── */

/* ───────── 今日の流れ ───────── */
function xPct(t) { return Math.max(0, Math.min(100, (t - S.dayStart) / 86400000 * 100)); }

function renderTimeline() {
  var ax = '';

  }

    var lane = (e.type === 'breast' || e.type === 'milk' || e.type === 'pump') ? 'f' : (e.type === 'pee' || e.type === 'poop' || e.type === 'both') ? 'd' : null;

    else html = '<div class="pt" style="left:' + xPct(e.t) + '%;background:' + COLORS[e.type] + '"></div>';

  });

}
function dialSvg(half) {
  var pt = function (r, deg) { var a = deg * Math.PI / 180; return [100 + r * Math.cos(a), 100 + r * Math.sin(a)]; };
  var o = '<svg viewBox="0 0 200 200" data-half="' + half + '" preserveAspectRatio="xMidYMid meet">';
  o += '<circle cx="100" cy="100" r="98" style="fill:var(--lane);stroke:var(--line)" stroke-width="1"/>';
  o += '<circle cx="100" cy="100" r="70" fill="none" style="stroke:var(--card)" stroke-width="16"/>';
  o += '<circle cx="100" cy="100" r="50" fill="none" style="stroke:var(--card)" stroke-width="16"/>';

  }

}
function renderDials() { if (!S) return; $('dials').innerHTML = dialSvg(0) + dialSvg(1); updateHands(); }
function updateHands() {

  for (var k = 0; k < 2; k++) { var el = document.getElementById('hand' + k); if (!el) continue; el.style.display = k === half ? '' : 'none'; el.setAttribute('transform', 'rotate(' + ((h % 12) * 30) + ' 100 100)'); }
}
function setView(v) {
  ls('pon.view', v); $('tlcard').classList.toggle('vclock', v === 'clock');
  Array.prototype.forEach.call(document.querySelectorAll('[data-view]'), function (b) { b.classList.toggle('on', b.dataset.view === v); });
  if (v === 'clock') renderDials();
}
$('dials').addEventListener('click', function (ev) {
  var svg = ev.target.closest('svg'); if (!svg || !S) return;
  var half = Number(svg.dataset.half), r0 = svg.getBoundingClientRect(), sc = 200 / Math.min(r0.width, r0.height);
  var x = (ev.clientX - r0.left - r0.width / 2) * sc, y = (ev.clientY - r0.top - r0.height / 2) * sc, r = Math.sqrt(x * x + y * y);

function laneClick(laneId, types) {

  var items = [
    [d.feeds + '回', '授乳（今日）'], [(d.milkMl + d.pumpMl) + 'ml', 'ミルク・搾乳'], [d.pee + '回', 'おしっこ'], [d.poop + '回', 'うんち'],

var CHEV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>';

/* ───────── 記録ボタン ───────── */
function beep() {
  try {
    var ac = new (window.AudioContext || window.webkitAudioContext)();
    [880, 1320].forEach(function (f, i) {
      var o = ac.createOscillator(), g = ac.createGain();

    });
  } catch (e) {}
}
var toastTimer;
function toast(msg) { var el = $('toast'); el.classList.remove('act'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2600); }

  el.firstChild.textContent = msg;

  el.classList.add('show', 'act'); clearTimeout(toastTimer);

  });
}

/* ───────── シート共通 ───────── */

  el.innerHTML = pad88 + items.map(function (it, i) { return '<div class="it" data-i="' + i + '">' + it.label + '</div>'; }).join('') + pad88;
  var timer;
  el.scrollTop = selIdx * H;

    clearTimeout(timer);
    timer = setTimeout(function () { var i = Math.max(0, Math.min(items.length - 1, Math.round(el.scrollTop / H))); onChange(items[i].v, i); }, 90);
  });
  el.addEventListener('click', function (e) { var it = e.target.closest('.it'); if (it) el.scrollTo({ top: Number(it.dataset.i) * H, behavior: 'smooth' }); });
}
function range(a, b, step, fmt) { var o = []; for (var v = a; v <= b; v += step) o.push({ v: v, label: fmt ? fmt(v) : String(v) }); return o; }

/* 授乳間隔 */

function breastSession(id) {

}

  if (focus === 'time') drawTime(); else drawContent();
}
function SIDE_REV(s) { return s === '左' ? 'L' : s === '右' ? 'R' : ''; }
function drawContent() {
  var d = ED, types = [['breast', '母乳'], ['milk', 'ミルク'], ['pump', '搾乳'], ['pee', 'おしっこ'], ['poop', 'うんち'], ['both', '両方']];
  var h = '<div class="ph"><h3>記録を直す</h3><button class="x" data-close>閉じる</button></div>';
  if (d.type === 'memo') {
    h += '<input class="noteIn" id="noteIn" value="" placeholder="メモ">';
  } else {
    h += '<div class="segc" id="typeSeg">' + types.map(function (t) { return '<button data-ty="' + t[0] + '" class="' + (d.type === t[0] ? 'on' : '') + '">' + t[1] + '</button>'; }).join('') + '</div>';
    if (d.type === 'breast') {
      h += '<div class="label">授乳した時間（スクロールで選びます）</div><div class="wheels"><div class="wc"><div class="wl">左</div><div class="bandc"></div><div class="wheel big" id="wL"></div></div><div class="wc"><div class="wl">右</div><div class="bandc"></div><div class="wheel big" id="wR"></div></div></div>';
      h += '<div class="label" style="margin-top:6px">先に飲んだ側</div><div class="segc" id="firstSeg"><button data-fs="L" class="' + (d.first === 'L' ? 'on' : '') + '">左が先</button><button data-fs="R" class="' + (d.first === 'R' ? 'on' : '') + '">右が先</button></div>';
    }
    if (d.type === 'milk' || d.type === 'pump') {
      h += '<div class="label">量</div><div class="stepper"><button data-st="amt" data-d="-10">−</button><div class="val"><span id="vAmt">' + d.amt + '</span><small>ml</small></div><button data-st="amt" data-d="10">＋</button></div><div class="quick">' + [20, 40, 60, 80, 100, 120].map(function (m) { return '<button data-qa="' + m + '">' + m + '</button>'; }).join('') + '</div>';
    }
  }
  h += '<div class="rowl"><span class="k">' + (d.type === 'breast' ? '開始時刻' : '時刻') + '</span><button class="v" id="timeRow">' + hm(d.t) + (startOfDay(d.t) !== startOfDay(Date.now()) ? '（' + (new Date(d.t).getMonth() + 1) + '/' + new Date(d.t).getDate() + '）' : '') + '　›</button></div>';
  h += '<div class="acts"><button class="btn dng" id="edDel">消す</button><button class="btn" data-close>キャンセル</button><button class="btn pri" id="edSave">保存</button></div>';
  openSheet(h, d.type === 'breast');
  if (d.type === 'memo') $('noteIn').value = d.note;
  if (d.type === 'breast') {
    var items = range(0, 60, 1, function (v) { return v ? v + '分' : 'なし'; });
    makeWheel($('wL'), items, d.l, function (v) { d.l = v; }, 52);
    makeWheel($('wR'), items, d.r, function (v) { d.r = v; }, 52);
  }
}
function drawTime() {
  var d = ED, dt = new Date(d.t), hh = dt.getHours(), mm = dt.getMinutes(), base = startOfDay(d.t);
  var dayLabel = function () { var x = new Date(base); return (x.getMonth() + 1) + '月' + x.getDate() + '日'; };
  openSheet('<div class="ph"><h3>時刻を直す</h3><button class="x" data-close>閉じる</button></div><div class="daystep"><button id="dPrev">‹</button><span id="dLbl">' + dayLabel() + '</span><button id="dNext">›</button></div><div class="wheels"><div class="band"></div><div class="wheel" id="wH"></div><span class="colon">:</span><div class="wheel" id="wM"></div></div><div class="acts"><button class="btn" id="tBack">' + (d.direct ? 'キャンセル' : '戻る') + '</button><button class="btn pri" id="tSave">' + (d.direct ? '保存' : '決定') + '</button></div>');
  makeWheel($('wH'), range(0, 23, 1, function (v) { return v; }), hh, function (v) { hh = v; });
  makeWheel($('wM'), range(0, 59, 1, function (v) { return pad(v); }), mm, function (v) { mm = v; });
  $('dPrev').onclick = function () { base -= 86400000; $('dLbl').textContent = dayLabel(); };
  $('dNext').onclick = function () { base += 86400000; $('dLbl').textContent = dayLabel(); };
  $('tBack').onclick = function () { if (d.direct) closeSheet(); else drawContent(); };
  $('tSave').onclick = function () {
    var x = new Date(base); x.setHours(hh, mm, 0, 0); d.t = x.getTime();
    if (d.direct) saveEdit(true); else drawContent();
  };
}
function saveEdit(timeOnly) {
  var d = ED, o = d.orig, p = { a: 'edit', id: d.id, withState: 1 }, patch = {};
  if (o.type === 'breast' && d.type === 'breast' && d.sess) {
    var bp = { a: 'breastset', id: d.id, l: timeOnly ? d.l : d.l, r: d.r, first: d.first, withState: 1 };
    if (d.t !== d.t0) bp.time = iso(d.t);
    closeSheet(); toast('直しています…');
    call(bp, function (r) { toast(r && r.ok ? '直しました' : '直せませんでした'); if (r && r.state) { S = r.state; render(); } else refresh(); });
    return;
  }
  if (d.t !== o.t) { p.time = iso(d.t); patch.t = d.t; }
  if (!timeOnly) {
    if (d.type !== o.type) { p.type = d.type; patch.type = d.type; patch.label = TYPE_LABEL[d.type]; }
    if (d.type === 'breast') {
      p.side = d.side; patch.side = SIDE[d.side] || ''; p.min = d.min; patch.min = d.min || '';
    }
    if (d.type === 'milk' || d.type === 'pump') { p.amt = d.amt; patch.amt = d.amt; patch.unit = 'ml'; }
    if (d.type === 'memo') { d.note = $('noteIn').value; p.note = d.note; patch.note = d.note; }
  }
  var id = d.id; closeSheet();
  // 先に画面を更新（通信は2〜3秒かかるため）
  [S.recent, S.timeline].forEach(function (arr) { arr.forEach(function (e) { if (e.id === id) { for (var k in patch) e[k] = patch[k]; e.end = (e.type === 'breast' && e.min) ? e.t + e.min * 60000 : (e.type === 'breast' ? null : e.end); } }); });
  S.recent.sort(function (a, b) { return b.t - a.t; });
  render();
  call(p, function (r) { toast(r && r.ok ? '直しました' : '直せませんでした'); if (r && r.state) { S = r.state; render(); } else refresh(); });
}
function deleteEdit() {
  var id = ED.id;
  if (!confirm('この記録を消しますか？')) return;
  closeSheet();
  S.recent = S.recent.filter(function (e) { return e.id !== id; }); S.timeline = S.timeline.filter(function (e) { return e.id !== id; }); render();
  call({ a: 'del', id: id, withState: 1 }, function (r) { toast(r && r.ok ? '消しました' : '消せませんでした'); if (r && r.state) { S = r.state; render(); } else refresh(); });
}

/* ───────── 声の案内（次回の5分前） ───────── */
var VOICE = { pref: ls('pon.voice') === '1', unlocked: false };
function jaVoice() { try { var vs = speechSynthesis.getVoices(); for (var i = 0; i < vs.length; i++) if (/^ja/i.test(vs[i].lang)) return vs[i]; } catch (e) {} return null; }
function speak(text) {
  try { var u = new SpeechSynthesisUtterance(text); u.lang = 'ja-JP'; var v = jaVoice(); if (v) u.voice = v; u.rate = 1; u.volume = 1; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {}
}
function unlockVoice() { if (VOICE.unlocked) return; try { var u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); VOICE.unlocked = true; } catch (e) {} updateVoiceBtn(); }
function updateVoiceBtn() {
  var b = $('voiceBtn'), t = $('voiceTxt');
  b.classList.remove('on', 'lock', 'off');
  if (!VOICE.pref) { b.classList.add('off'); t.textContent = '音声案内 オフ'; }
  else if (!VOICE.unlocked) { b.classList.add('lock'); t.textContent = '画面をタップして有効に'; }
  else { b.classList.add('on'); t.textContent = '音声案内 オン'; }
}
function checkAnnounce() {
  if (!VOICE.pref || !VOICE.unlocked || !S || !S.nextFeedAt) return;
  var rem = S.nextFeedAt - Date.now();
  if (rem > 5 * 60000 || rem < -10 * 60000) return;
  if (ls('pon.announced') === String(S.nextFeedAt)) return;
  ls('pon.announced', String(S.nextFeedAt));
  beep(); setTimeout(function () { speak(S.announceText || 'もうすぐミルクの時間です'); }, 500);
}
document.addEventListener('pointerdown', function () { if (VOICE.pref && !VOICE.unlocked) unlockVoice(); }, true);

/* ───────── イベント ───────── */
for (var ml = 20; ml <= 200; ml += 20) {}
document.addEventListener('click', function (ev) {
  var b = ev.target.closest('button, #clock'); if (!b) return;
  if (b.id === 'clock') { nightOverride = !isNight(); tick(); return; }
  if (b.dataset.view) { setView(b.dataset.view); return; }
  if (b.id === 'ivBtn') { openInterval(); return; }
  if (b.id === 'helpBtn') { openVoiceHelp(); return; }
  if (b.id === 'voiceBtn') {
    VOICE.pref = !VOICE.pref; ls('pon.voice', VOICE.pref ? '1' : '0');
    if (VOICE.pref) { VOICE.unlocked = false; unlockVoice(); speak('音声案内をオンにしました'); } updateVoiceBtn(); return;
  }
  if (b.dataset.close !== undefined) { closeSheet(); return; }
  if (b.dataset.ago !== undefined) { setAgo(Number(b.dataset.ago)); return; }
  if (b.dataset.open === 'milk') { openMilk(); return; }
  if (b.dataset.edit) { openEdit(b.dataset.edit, b.dataset.focus); return; }
  if (ED) {
    if (b.dataset.ty) { ED.type = b.dataset.ty; if ((ED.type === 'milk' || ED.type === 'pump') && !ED.amt) ED.amt = 60; drawContent(); return; }
    if (b.dataset.fs) { ED.first = b.dataset.fs; Array.prototype.forEach.call(document.querySelectorAll('[data-fs]'), function (x) { x.classList.toggle('on', x.dataset.fs === ED.first); }); return; }
    if (b.dataset.sd !== undefined) { ED.side = b.dataset.sd; drawContent(); return; }
    if (b.dataset.st) { var k = b.dataset.st, dl = Number(b.dataset.d); ED[k] = Math.max(0, ED[k] + dl); $(k === 'min' ? 'vMin' : 'vAmt').textContent = ED[k]; return; }
    if (b.dataset.qm !== undefined) { ED.min = Number(b.dataset.qm); $('vMin').textContent = ED.min; return; }
    if (b.dataset.qa !== undefined) { ED.amt = Number(b.dataset.qa); $('vAmt').textContent = ED.amt; return; }
    if (b.id === 'timeRow') { drawTime(); return; }
    if (b.id === 'edSave') { saveEdit(false); return; }
    if (b.id === 'edDel') { deleteEdit(); return; }
  }
  if (b.dataset.ml) { closeSheet(); act({ a: 'add', t: b.dataset.mt || 'milk', amt: b.dataset.ml }); return; }
  if (b.dataset.a) {
    var p = { a: b.dataset.a };
    if (b.dataset.t) p.t = b.dataset.t;
    if (b.dataset.side) p.side = b.dataset.side;
    if (p.a === 'undo' && !confirm('直前の記録を取り消しますか？')) return;
    act(p);
  }
});
function openMilk() {
  var h = '<div class="ph"><h3>ミルクの量</h3><button class="x" data-close>閉じる</button></div><div class="segc"><button class="on" id="mt1" data-x="milk">ミルク</button><button id="mt2" data-x="pump">搾乳</button></div><div class="quick" style="margin-top:10px">';
  for (var m = 20; m <= 200; m += 20) h += '<button data-ml="' + m + '" data-mt="milk" style="min-height:56px;font-size:19px">' + m + '</button>';
  openSheet(h + '</div>');
  var kind = 'milk';
  $('mt1').onclick = function () { kind = 'milk'; $('mt1').classList.add('on'); $('mt2').classList.remove('on'); Array.prototype.forEach.call(document.querySelectorAll('[data-ml]'), function (x) { x.dataset.mt = 'milk'; }); };
  $('mt2').onclick = function () { kind = 'pump'; $('mt2').classList.add('on'); $('mt1').classList.remove('on'); Array.prototype.forEach.call(document.querySelectorAll('[data-ml]'), function (x) { x.dataset.mt = 'pump'; }); };
}
laneClick('laneFeed', ['breast', 'milk', 'pump']);
laneClick('laneDiaper', ['pee', 'poop', 'both']);
try { speechSynthesis.getVoices(); } catch (e) {}
updateVoiceBtn();
setView(ls('pon.view') === 'clock' ? 'clock' : 'bar');
tick(); refresh();
setInterval(tick, 1000);
setInterval(refresh, 30000);
document.addEventListener('visibilitychange', function () { if (!document.hidden) refresh(); });
</script>
</body>

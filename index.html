<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>PONログ</title>
<style>
  :root {
    --bg: linear-gradient(160deg, #f5f7fb 0%, #e9edf6 100%); --card: rgba(255,255,255,.88); --ink: #15171c; --sub: #6a7080; --line: rgba(20,24,40,.09);
    --grid3: rgba(20,24,40,.16); --grid1: rgba(20,24,40,.06); --lane: rgba(20,24,40,.045);
    --feed: #1a46d0; --breast: #8ea6d0; --milk: #ffffff; --milkEdge: rgba(20,24,40,.28); --pump: #8487d6; --spit: #9db8a0; --bath: #7fbfc4; --pee: #e6b66e; --poop: #a88566; --winS: #c4d9e6; --band: #e6e4ee;
    --warn: #f59e0b; --alert: #ef4444; --ok: #22a06b; --accent: #2f7bff; --win: rgba(90,200,250,.30);
    --btn: #ffffff; --btnInk: #15171c; --sheet: #ffffff; --chip: rgba(20,24,40,.06);
    --shadow: 0 1px 1px rgba(20,24,40,.04), 0 10px 28px rgba(20,24,40,.07);
    --clk: clamp(64px, 19.5vh, 176px);
  }
  body.night {
    --bg: linear-gradient(160deg, #0d0706 0%, #120907 100%); --card: rgba(30,16,13,.92); --ink: #ffb9a5; --sub: #a96b5e; --line: rgba(255,150,120,.12);
    --grid3: rgba(255,150,120,.20); --grid1: rgba(255,150,120,.07); --lane: rgba(255,150,120,.05);
    --feed: #ff7a5c; --breast: #6f86c0; --milk: #eadcd3; --milkEdge: transparent; --pump: #8a84c8; --spit: #93a585; --bath: #5f9a9e; --pee: #d3ab6f; --poop: #a88470; --winS: #3d4d5a; --band: #2a1c19;
    --warn: #ffa050; --alert: #ff5040; --ok: #c98a68; --accent: #ff7a5c; --win: rgba(110,200,230,.20);
    --btn: #231310; --btnInk: #ffb9a5; --sheet: #1e100d; --chip: rgba(255,150,120,.10);
    --shadow: none;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100vh; color: var(--ink); background: var(--bg); background-attachment: fixed; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans", sans-serif;
    padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    transition: color .6s; -webkit-user-select: none; user-select: none;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
  svg { display: block; }
  .wrap { display: grid; gap: 10px; grid-template-columns: 1fr; }
  .colL, .colR { display: flex; flex-direction: column; gap: 10px; min-height: 0; min-width: 0; }
  .card { background: var(--card); border-radius: 22px; padding: 12px 16px; box-shadow: var(--shadow); border: 1px solid var(--line); transition: background .6s; }
  .label { color: var(--sub); font-size: 13px; font-weight: 600; letter-spacing: .02em; }

  /* 上段：時計は「前の授乳」の枠に少し乗せる */
  .top { position: relative; z-index: 2; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 0 6px; margin-bottom: calc(var(--clk) * -0.4); pointer-events: none; }
  .top > * { pointer-events: none; }
  .top .tools, .top .tool, .top .clock { pointer-events: auto; }
  .pill { z-index: 3; }
  .pill::after { content: ''; position: absolute; inset: -10px -12px -12px -16px; }
  .clock { font-size: var(--clk); font-weight: 600; letter-spacing: -0.035em; font-variant-numeric: tabular-nums; line-height: 1; }
  .top-r { min-width: 0; flex: 0 1 auto; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; padding-bottom: calc(var(--clk) * 0.46); }
  .tools { display: flex; flex-wrap: nowrap; justify-content: flex-end; gap: 6px; }
  .tool { white-space: nowrap; flex: none; }
  .tool { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 13px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); font-size: 12.5px; font-weight: 600; color: var(--sub); box-shadow: var(--shadow); }
  .tool svg { width: 15px; height: 15px; }
  .tool.on { color: var(--ok); }
  .tool.lock { color: var(--warn); }
  .tool.off { color: var(--alert); }
  .date { text-align: right; line-height: 1.15; }
  .date { white-space: nowrap; }
  .date .dd { font-size: clamp(20px, 3.5vh, 28px); font-weight: 700; color: var(--ink); letter-spacing: -0.01em; }
  .wx { display: block; white-space: nowrap; margin-top: 1px; }
  .wx b { font-weight: 700; }
  .wx .hi { color: var(--warn); }
  .wx .lo { color: var(--feed); }
  .date .da { font-size: 14px; color: var(--sub); font-weight: 500; margin-top: 3px; }

  /* 前の授乳から／次回授乳 */
  .hero { position: relative; display: grid; grid-template-columns: 1.05fr 1fr; gap: 6px 18px; padding-top: calc(var(--clk) * 0.4 + 10px); padding-bottom: 12px; }
  .blk { min-width: 0; }
  .blk .label { height: 28px; display: flex; align-items: center; margin-bottom: 6px; }
  .nextLbl { display: inline-flex; align-items: center; gap: 5px; height: 28px; margin: 0 0 6px -10px; padding: 0 10px; border-radius: 14px; background: var(--chip); color: var(--sub); font-size: 13px; font-weight: 600; letter-spacing: .02em; transition: transform .12s, opacity .2s; }
  .nextLbl:active { transform: scale(.96); opacity: .8; }
  .nextLbl svg { width: 13px; height: 13px; flex: none; }
  .nextLbl.once { background: var(--accent); color: #fff; }
  .since { font-size: clamp(40px, 12vh, 108px); font-weight: 700; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; line-height: 1; }
  .since { white-space: nowrap; }
  .since.long { font-size: clamp(36px, 10.5vh, 92px); }
  /* 左右の数字の段を同じ高さにして、下の補足（13:31 母乳／あと◯分）の高さをそろえる */
  .since, .nextT { height: clamp(40px, 12vh, 108px); display: flex; align-items: flex-end; }
  .since.long { line-height: 1.12; }
  .since small { font-size: .3em; font-weight: 600; letter-spacing: 0; margin: 0 5px 0 3px; color: var(--sub); }
  .nextT { cursor: pointer; font-size: clamp(40px, 12vh, 108px); font-weight: 700; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; line-height: 1; }
  .nextSub, .sinceSub { font-size: 16px; font-weight: 600; color: var(--sub); margin-top: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sinceSub b { color: var(--ink); font-weight: 600; }
  .hero.warn .nextT, .hero.warn .nextSub { color: var(--warn); }
  .hero.alert .nextT, .hero.alert .nextSub { color: var(--alert); }
  .meta { grid-column: 1 / -1; font-size: 14.5px; color: var(--sub); display: flex; gap: 14px; flex-wrap: wrap; }
  .meta b { color: var(--ink); font-weight: 600; }
  .pill { position: absolute; top: 10px; right: 12px; height: 30px; padding: 0 14px; border-radius: 15px; background: var(--chip); font-size: 12.5px; font-weight: 600; color: var(--sub); }
  .pill b { color: var(--ink); font-weight: 700; margin-left: 4px; font-variant-numeric: tabular-nums; }

  /* 今日の流れ */
  .tl { padding-bottom: 10px; display: flex; flex-direction: column; min-height: 0; }
  .tlhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .legend { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 2px 5px; font-size: 10px; letter-spacing: -.02em; color: var(--sub); min-width: 0; }
  .legend span { white-space: nowrap; }
  .tlhead > div:first-child { flex: none; white-space: nowrap; }
  .legend i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 2px; vertical-align: 0; }
  .plot { flex: 1 1 auto; min-height: 120px; display: grid; grid-template-columns: 42px 1fr; grid-template-rows: 30px 1fr; column-gap: 4px; row-gap: 6px; margin-top: 6px; position: relative; }
  .axis { position: relative; grid-column: 2; grid-row: 1; }
  .tk { position: absolute; bottom: 4px; transform: translateX(-50%); font-variant-numeric: tabular-nums; white-space: nowrap; line-height: 1; }
  .tk.major { font-size: 13.5px; font-weight: 700; color: var(--ink); }
  .tk.minor { font-size: 10px; font-weight: 500; color: var(--sub); opacity: .65; }
  .tk.edge-l { transform: none; }
  .tk.edge-r { transform: translateX(-100%); }
  .lname { font-size: 12px; font-weight: 600; color: var(--sub); align-self: center; }
  .lane { position: relative; border-radius: 10px; background-color: var(--lane); cursor: pointer;
    background-image: linear-gradient(to right, var(--grid3) 1px, transparent 1px), linear-gradient(to right, var(--grid1) 1px, transparent 1px);
    background-size: calc(100% / 8) 100%, calc(100% / 24) 100%; overflow: hidden; }
  .seg { position: absolute; top: 0; bottom: 0; border-radius: 4px; min-width: 9px; z-index: 1; }
  .pt { position: absolute; z-index: 2; top: 50%; width: 19px; height: 19px; margin: -9.5px 0 0 -9.5px; border-radius: 50%; box-shadow: 0 0 0 2px var(--card); }
  .nowwrap { grid-column: 2; grid-row: 1 / 3; position: relative; pointer-events: none; }
  .nextwin { position: absolute; top: 36px; bottom: 0; background: var(--win); border-radius: 7px; }
  .now { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--alert); border-radius: 1px; }
  .now::before { content: ''; position: absolute; top: -1px; left: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--alert); }

  .vsw { display: inline-flex; background: var(--chip); border-radius: 10px; padding: 2px; margin-left: 12px; }
  .vsw button { padding: 4px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; color: var(--sub); }
  .vsw button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.14); }
  .dials { display: none; flex: 1 1 0; min-height: 0; margin-top: 6px; grid-template-columns: 1fr 1fr; grid-template-rows: minmax(0, 1fr); gap: 10px; }
  .dials svg { width: 100%; height: 100%; cursor: pointer; overflow: visible; }
  .tl.vclock .plot { display: none; }
  .tl.vclock .dials { display: grid; }
  .stats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; padding: 10px 12px; }
  .stat { text-align: center; min-width: 0; }
  .stat .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; height: 26px; line-height: 26px; white-space: nowrap; }
  .stat .k { font-size: 11px; color: var(--sub); margin-top: 3px; font-weight: 500; height: 15px; line-height: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ボタン */
  .btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .b { min-height: clamp(72px, 14vh, 118px); border-radius: 20px; background: var(--btn); color: var(--btnInk); font-size: 20px; font-weight: 650; line-height: 1.25; padding: 8px 8px; border: 1px solid var(--line); box-shadow: var(--shadow); transition: transform .12s, opacity .2s; display: flex; align-items: center; justify-content: center; gap: 6px; text-align: center; }
  .b:active { transform: scale(.96); opacity: .8; }
  .b .sw { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .b.low { min-height: clamp(52px, 8.5vh, 72px); font-size: 17px; grid-column: span 2; color: var(--sub); }
  .b.low.one { grid-column: span 1; }
  .b.low.bath { color: var(--btnInk); }
  .b.low.ago { flex-direction: column; gap: 0; line-height: 1.15; }
  .b.low.ago .agoK { font-size: 12px; font-weight: 600; color: var(--sub); }
  .b.low.ago #agoV { font-size: 17px; font-weight: 700; color: var(--btnInk); font-variant-numeric: tabular-nums; }
  .b.low.ago.on { background: var(--accent); border-color: var(--accent); }
  .b.low.ago.on .agoK, .b.low.ago.on #agoV { color: #fff; }
  .agoGrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 10px 0 4px; }
  .agoGrid button { min-height: 70px; border-radius: 16px; background: var(--chip); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .agoGrid button.on { background: var(--accent); color: #fff; }
  .agoGrid button.wide { grid-column: span 3; font-size: 19px; min-height: 60px; }
  .memo { display: flex; flex-direction: column; justify-content: center; width: 100%; height: 96px; margin-bottom: 8px; padding: 4px 0; border-radius: 12px; background: #14151a; overflow: hidden; position: relative; font-family: 'DotGothic16', 'Hiragino Maru Gothic ProN', monospace; white-space: nowrap; text-align: left; }
  .memo .mline { flex: 1; display: flex; align-items: center; overflow: hidden; min-height: 0; }
  .memo .mline span { display: inline-block; padding-left: 100%; will-change: transform; animation: marquee var(--mdur, 14s) linear infinite; }
  .memo.n1 { font-size: 54px; }
  .memo.n2 { font-size: 30px; }
  .memo.n2 .mline + .mline { border-top: 1px solid rgba(255,255,255,.08); }
  .memo.empty { background: var(--chip); font-family: inherit; font-size: 14px; font-weight: 600; color: var(--sub); align-items: center; }
  @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-100%); } }
  .swatches { display: flex; gap: 10px; margin: 10px 0 4px; }
  .swatches button { width: 40px; height: 40px; border-radius: 50%; border: 3px solid transparent; background-clip: padding-box; }
  .swatches button.on { border-color: var(--ink); }
  .list .dot { display: inline-block; width: 13px; height: 13px; border-radius: 50%; margin-right: 10px; flex: none; vertical-align: -1px; }
  .rhead { display: flex; justify-content: space-between; align-items: center; }
  .rhead button { font-size: 12.5px; font-weight: 600; color: var(--sub); background: var(--chip); border-radius: 10px; padding: 5px 12px; }
  .agoRow { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
  .agoRow .label { white-space: nowrap; font-size: 12.5px; margin-right: 2px; }
  .chip { flex: 1; min-height: 38px; border-radius: 12px; background: var(--chip); font-size: 14px; font-weight: 600; color: var(--sub); padding: 8px 10px; }
  .chip.on { background: var(--ink); color: var(--card); }
  .chip { white-space: nowrap; }
  .agoRow .label { min-width: 4.6em; }
  .recentcard { display: flex; flex-direction: column; min-height: 0; }
  .list { list-style: none; margin: 4px 0 0; padding: 0; }
  .list li { display: flex; align-items: stretch; border-bottom: 1px solid var(--line); }
  .list li:last-child { border-bottom: 0; }
  .list li.daysep { display: block; border-bottom: 0; padding: 10px 0 4px; font-size: 12.5px; font-weight: 700; color: var(--sub); letter-spacing: .04em; }
  .list li.daysep span { display: inline-block; background: var(--chip); border-radius: 8px; padding: 3px 10px; }
  .list .t { width: 64px; text-align: left; font-variant-numeric: tabular-nums; color: var(--sub); font-size: 15.5px; font-weight: 600; padding: 9px 0; }
  .list .n { flex: 1; text-align: left; font-size: 16px; font-weight: 600; padding: 9px 0; display: flex; justify-content: space-between; align-items: center; }
  .list .n span.sub { color: var(--sub); font-weight: 500; font-size: 14px; }
  .list .n svg { width: 14px; height: 14px; color: var(--sub); opacity: .6; }
  .err { color: var(--alert); font-size: 12.5px; min-height: 0; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 220%); opacity: 0; pointer-events: none; background: rgba(21,23,28,.92); color: #fff; padding: 12px 20px; border-radius: 16px; font-size: 16.5px; font-weight: 600; transition: transform .35s cubic-bezier(.2,.9,.3,1.2), opacity .25s; z-index: 30; max-width: 90vw; text-align: center; }
  body.night .toast { background: rgba(70,24,18,.96); color: #ffb9a5; }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }
  .toast.act { pointer-events: auto; display: flex; gap: 14px; align-items: center; padding: 10px 12px 10px 20px; }
  .toast .ta { background: var(--accent); color: #fff; border-radius: 12px; padding: 9px 16px; font-size: 15.5px; font-weight: 700; }

  /* シート */
  .sheet { position: fixed; inset: 0; background: rgba(8,10,18,.38); display: none; align-items: flex-end; justify-content: center; z-index: 20; }
  .sheet.show { display: flex; animation: fade .2s ease; }
  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  @keyframes rise { from { transform: translateY(40px); opacity: .4 } to { transform: none; opacity: 1 } }
  .panel.wide { max-width: 680px; }
  .panel { background: var(--sheet); width: 100%; max-width: 560px; border-radius: 26px 26px 0 0; padding: 14px 18px max(16px, env(safe-area-inset-bottom)); animation: rise .28s cubic-bezier(.2,.9,.3,1); max-height: 92vh; overflow-y: auto; }
  .ph { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .ph h3 { margin: 0; font-size: 18px; font-weight: 700; }
  .ph .x { font-size: 15px; font-weight: 600; color: var(--accent); padding: 6px 4px; }
  .acts { display: flex; gap: 8px; margin-top: 12px; }
  /* 窓の中身が長くても、消す・保存などのボタンの段はいつも下に見えるように（2026-11-14） */
  .panel > .acts:last-child { position: sticky; bottom: calc(-1 * max(16px, env(safe-area-inset-bottom))); z-index: 5; background: var(--sheet); margin: 12px -18px 0; padding: 10px 18px max(16px, env(safe-area-inset-bottom)); box-shadow: 0 -1px 0 var(--line); }
  .acts .btn { flex: 1; min-height: 48px; border-radius: 14px; font-size: 16px; font-weight: 650; background: var(--chip); }
  .acts .btn.pri { background: var(--accent); color: #fff; }
  .acts .btn.dng { color: var(--alert); flex: .7; }
  .acts .btn.dng.sure { background: var(--alert); color: #fff; flex: 1.4; font-size: 14px; }
  #undoOk { background: var(--alert); color: #fff; flex: 1; }
  .rowl { display: flex; justify-content: space-between; align-items: center; padding: 12px 2px; border-bottom: 1px solid var(--line); font-size: 16px; }
  .rowl .k { color: var(--sub); font-weight: 600; font-size: 14px; }
  .rowl button.v { font-weight: 700; color: var(--accent); font-size: 17px; font-variant-numeric: tabular-nums; }
  .segc { display: flex; background: var(--chip); border-radius: 12px; padding: 3px; gap: 2px; margin: 8px 0; }
  .segc button { flex: 1; min-height: 40px; padding: 6px 10px; border-radius: 10px; font-size: 14.5px; font-weight: 600; color: var(--sub); }
  .glg { display: flex; gap: 12px; font-size: 12px; font-weight: 600; color: var(--sub); }
  .glg i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
  .segc.gr { margin: 0; flex: none; }
  .segc.gr button { min-height: 32px !important; font-size: 13px !important; padding: 4px 12px; white-space: nowrap; flex: none; }
  .segc button.on { background: var(--sheet); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  .stepper { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 8px 0; }
  .stepper .val { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 120px; text-align: center; }
  .stepper .val small { font-size: 15px; color: var(--sub); font-weight: 600; margin-left: 4px; }
  .stepper button { width: 56px; height: 56px; border-radius: 28px; background: var(--chip); font-size: 28px; font-weight: 500; line-height: 1; }
  .quick { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 6px; }
  .quick button { flex: 1; min-width: 56px; min-height: 38px; padding: 6px 10px; border-radius: 10px; background: var(--chip); font-size: 14px; font-weight: 600; }
  .noteIn { width: 100%; font: inherit; font-size: 16px; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--chip); color: var(--ink); margin: 8px 0; -webkit-user-select: text; user-select: text; }
  .wheels { display: flex; gap: 6px; justify-content: center; align-items: center; position: relative; isolation: isolate; }
  .wheel { position: relative; height: 220px; width: 110px; overflow-y: auto; scroll-snap-type: y mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch;
    -webkit-mask-image: linear-gradient(transparent, #000 32%, #000 68%, transparent); mask-image: linear-gradient(transparent, #000 32%, #000 68%, transparent); }
  .wheel::-webkit-scrollbar { display: none; }
  .wheel .pad { height: 88px; }
  .wheel .it { height: 44px; scroll-snap-align: center; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink); }
  .wc { position: relative; display: flex; flex-direction: column; align-items: center; }
  .wl { font-size: 17px; font-weight: 700; color: var(--sub); height: 26px; }
  .wheel.big { height: 270px; width: 170px; }
  .wheel.big .pad { height: 109px; }
  .wheel.big .it { height: 52px; font-size: 30px; }
  .bandc { position: absolute; left: 6px; right: 6px; top: 135px; height: 52px; border-radius: 14px; background: var(--chip); z-index: -1; }
  .panel.wide .acts .btn { min-height: 58px; font-size: 18px; }
  .panel.wide .segc button { min-height: 46px; font-size: 16px; }

  openSheet('<div class="ph"><h3>引き継ぎメモ</h3><button class="x" data-close>閉じる</button></div><div class="label">次に見る人への一言。2つまで書けます。それぞれ保存から10時間で消えます</div>' + block(0) + block(1) +
    '<div class="acts">' + (ms.length ? '<button class="btn dng" id="memoDel">全部消す</button>' : '') + '<button class="btn" data-close>キャンセル</button><button class="btn pri" id="memoSave">保存</button></div>', true);
  [0, 1].forEach(function (i) { $('memoIn' + i).value = slots[i] ? slots[i].text : ''; });
  Array.prototype.forEach.call(document.querySelectorAll('.swatches[data-slot]'), function (sw) {
    sw.onclick = function (ev) { var x = ev.target.closest('[data-mc]'); if (!x) return; colors[Number(sw.dataset.slot)] = x.dataset.mc; Array.prototype.forEach.call(sw.children, function (c) { c.classList.toggle('on', c === x); }); };
  });
  var save = function (t0, t1) {
    closeSheet(); toast('保存しています…');
    call({ a: 'set', k: 'memos', t0: t0, c0: colors[0], t1: t1, c1: colors[1], withState: 1 }, function (r) { toast(r && r.ok ? (t0 || t1 ? 'メモを保存しました' : 'メモを消しました') : '保存できませんでした'); if (r && r.state) { S = r.state; render(); } else refresh(); });
  };
  var clean = function (i) { return $('memoIn' + i).value.replace(/\s+/g, ' ').trim(); };
  $('memoSave').onclick = function () {
    var a = clean(0), b2 = clean(1);
    if (!a && b2) { a = b2; b2 = ''; colors = [colors[1], colors[0]]; }
    if (!a && !ms.length) { toast('メモを入れてください'); return; }
    save(a, b2);
  };
  if (ms.length) $('memoDel').onclick = function () { save('', ''); };
  // 片方だけ消す：もう片方は書いてある内容のまま残す（消える時刻もそのまま）
  Array.prototype.forEach.call(document.querySelectorAll('.memoDelOne'), function (btn) {
    btn.onclick = function () {
      var k = Number(btn.dataset.del), other = 1 - k, keepTxt = slots[other] ? slots[other].text : '';
      if (other === 0) save(keepTxt, ''); else { colors = [colors[1], colors[0]]; save(keepTxt, ''); }
    };
  });
}
laneClick('laneFeed', ['breast', 'milk', 'pump', 'pee', 'poop', 'both', 'spit', 'bath']);
try { speechSynthesis.getVoices(); } catch (e) {}
updateVoiceBtn();
setView(ls('pon.view') === 'clock' ? 'clock' : 'bar');
function openSetup() {
  openSheet('<div class="ph"><h3>はじめの設定</h3></div><div class="label">PONログのリンクを、ここに貼ってください（LINEで送られたリンク）</div><textarea class="noteIn" id="cfgIn" rows="4" placeholder="https://zukuyo.github.io/pon-board/#key=…"></textarea><div class="err" id="cfgErr"></div><div class="acts"><button class="btn pri" id="cfgSave">保存して開く</button></div>', true);
  $('sheet').onclick = null;
  $('cfgSave').onclick = function () {
    var t = $('cfgIn').value, i = t.indexOf('#'), h = {};
    if (i >= 0) t.slice(i + 1).split('&').forEach(function (kv) { var j = kv.indexOf('='); if (j > 0) h[kv.slice(0, j)] = decodeURIComponent(kv.slice(j + 1).trim()); });
    if (!h.key || !h.exec) { $('cfgErr').textContent = 'リンクが正しくないようです。LINEのリンクを、そのまま貼ってください'; return; }
    try { localStorage.setItem('pon.cfg', JSON.stringify({ key: h.key, exec: h.exec })); } catch (e) {}
    location.hash = '#key=' + encodeURIComponent(h.key) + '&exec=' + encodeURIComponent(h.exec); location.reload();
  };
}
if (!KEY || !EXEC) { hideBoot(); openSetup(); } else {
  tick(); refresh();
  setInterval(tick, 1000);
  setInterval(refresh, 30000);
  loadTile(); setInterval(loadTile, 3600000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) refresh(); });
}
</script>
</body>
</html>
